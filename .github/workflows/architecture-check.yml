name: Architecture Enforcement

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  architecture-check:
    name: ERP Surface Architecture Purity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make script executable
        run: chmod +x ci/check-architecture.sh

      - name: Run Architecture Check
        id: arch-check
        run: ./ci/check-architecture.sh

      - name: Upload violation report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-violations
          path: |
            ci/check-architecture.sh
          retention-days: 30

      - name: Comment on PR (if violations)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Architecture Violation Detected

            This PR introduces changes that violate the **erp-surface architectural constraints**.

            The erp-surface repository must remain a **pure abstraction surface** containing only:
            - Type definitions and interfaces
            - Schema definitions
            - Contract specifications
            - Constants

            **Forbidden elements detected:**
            - Infrastructure dependencies
            - Execution/runtime code
            - ERP vendor SDK integrations
            - Cross-layer imports

            Please review the CI logs and remove all violating code before merging.

            See \`ci/check-architecture.sh\` for the complete list of constraints.`
            })
